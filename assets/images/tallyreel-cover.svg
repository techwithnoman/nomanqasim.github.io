<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="TallyReel — AI-powered faceless video generator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F0E"/>
      <stop offset="0.6" stop-color="#0D1411"/>
      <stop offset="1" stop-color="#121A16"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="74%" cy="40%" r="58%">
      <stop offset="0" stop-color="#A21CAF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#7E22CE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="8%" cy="92%" r="55%">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#F5F7F5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.55" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.45" stop-color="#581C87"/>
      <stop offset="0.8" stop-color="#A21CAF"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#FDF4FF" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#F0ABFC" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#C026D3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clipA"><rect x="0" y="0" width="208" height="372" rx="26"/></clipPath>
    <clipPath id="clipB"><rect x="0" y="0" width="252" height="438" rx="30"/></clipPath>
    <clipPath id="clipC"><rect x="0" y="0" width="190" height="340" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glowPurple)"/>
  <rect width="1200" height="900" fill="url(#glowGreen)"/>

  <!-- top pill -->
  <g>
    <rect x="80" y="104" width="176" height="38" rx="19" fill="#22C55E" fill-opacity="0.09" stroke="#22C55E" stroke-opacity="0.35"/>
    <circle cx="101" cy="123" r="4" fill="#22C55E"/>
    <text x="114" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.6" fill="#4ADE80">LIVE PRODUCT</text>
  </g>

  <!-- wordmark -->
  <text x="76" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-5" fill="#F5F7F5">TallyReel</text>
  <text x="80" y="348" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#A3ADA7">AI-powered faceless video generator</text>

  <rect x="80" y="392" width="56" height="3" rx="1.5" fill="#22C55E"/>

  <text x="80" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#A3ADA7">Idea → script → voice → visuals → captions,</text>
  <text x="80" y="480" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#A3ADA7">generated and published from one place.</text>

  <!-- video cards -->
  <g transform="translate(610 268) rotate(-11)" filter="url(#shadow)" opacity="0.96">
    <g clip-path="url(#clipA)">
      <rect width="208" height="372" fill="url(#cardA)"/>
      <circle cx="104" cy="150" r="74" fill="#FFFFFF" fill-opacity="0.14"/>
      <circle cx="104" cy="150" r="42" fill="#0B0F0E" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.55"/>
      <path d="M97 134l22 16-22 16z" fill="#FFFFFF"/>
      <text x="18" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Money facts</text>
      <text x="18" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.75">0:28 · AI voice</text>
    </g>
  </g>

  <g transform="translate(742 196) rotate(2)" filter="url(#shadow)">
    <g clip-path="url(#clipB)">
      <rect width="252" height="438" fill="url(#cardB)"/>
      <circle cx="126" cy="188" r="96" fill="#C026D3" opacity="0.35" filter="url(#soft)"/>
      <circle cx="126" cy="188" r="74" fill="url(#nebula)"/>
      <circle cx="126" cy="188" r="38" fill="#0B0F0E" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.65"/>
      <path d="M117 170l24 18-24 18z" fill="#FFFFFF"/>
      <rect x="18" y="18" width="66" height="22" rx="11" fill="#000000" fill-opacity="0.3"/>
      <text x="30" y="33" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#FFFFFF">SPACE</text>
      <text x="20" y="372" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Into a black hole</text>
      <text x="20" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.75">What you'd see · 0:34</text>
    </g>
  </g>

  <g transform="translate(982 286) rotate(12)" filter="url(#shadow)" opacity="0.94">
    <g clip-path="url(#clipC)">
      <rect width="190" height="340" fill="url(#cardC)"/>
      <circle cx="95" cy="140" r="64" fill="#FFFFFF" fill-opacity="0.16"/>
      <circle cx="95" cy="140" r="34" fill="#0B0F0E" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.55"/>
      <path d="M89 126l19 14-19 14z" fill="#FFFFFF"/>
      <text x="16" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Ancient history</text>
      <text x="16" y="312" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.75">Pyramids · 0:41</text>
    </g>
  </g>

  <!-- bottom meta -->
  <line x1="80" y1="800" x2="1120" y2="800" stroke="#F5F7F5" stroke-opacity="0.1"/>
  <text x="80" y="842" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.4" fill="#A3ADA7">PROMPT TESTING</text>
  <circle cx="226" cy="837" r="2.5" fill="#22C55E"/>
  <text x="242" y="842" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.4" fill="#A3ADA7">AI OUTPUT REVIEW</text>
  <circle cx="432" cy="837" r="2.5" fill="#22C55E"/>
  <text x="448" y="842" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.4" fill="#A3ADA7">UX EVALUATION</text>
</svg>
